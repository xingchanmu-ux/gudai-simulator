<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>架空古代模拟器</title>
<style>
:root {
  --bg: #0A0A0A;
  --panel: #1A1A1A;
  --border: #8B1A1A;
  --primary: #C0392B;
  --accent: #E74C3C;
  --text: #E8E0D0;
  --muted: #7F8C8D;
  --dark-red: #922B21;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 16px;
  line-height: 1.8;
}
#app {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
.screen {
  display: none;
  flex-direction: column;
  padding: 24px 20px;
  flex: 1;
  animation: fadeIn 0.3s ease;
}
.screen.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
@keyframes bloodIn { from { color: #4A0E0E; opacity: 0.3; } to { color: var(--accent); opacity: 1; } }
.btn {
  display: block;
  width: 100%;
  padding: 14px 20px;
  margin: 8px 0;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
  letter-spacing: 2px;
}
.btn:hover, .btn:active { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.title {
  text-align: center;
  color: var(--primary);
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 8px;
  margin: 20px 0;
}
.title .diamond { display: block; color: var(--border); font-size: 14px; letter-spacing: 0; margin: 8px 0; }
.subtitle { text-align: center; color: var(--muted); font-size: 12px; margin: 10px 0; }
.event-title { color: var(--border); font-size: 18px; font-weight: bold; margin-bottom: 12px; animation: slideIn 0.3s ease; }
.event-text { color: var(--text); font-size: 16px; margin-bottom: 16px; white-space: pre-wrap; animation: slideIn 0.3s ease 0.1s both; }
.option {
  display: block; width: 100%; padding: 12px 14px; margin: 8px 0;
  background: transparent; border: 1px solid #2A2A2A; color: var(--text);
  font-size: 15px; font-family: inherit; cursor: pointer; text-align: left;
  transition: all 0.2s; animation: slideIn 0.3s ease;
}
.option:hover, .option:active { border-color: var(--accent); color: var(--accent); padding-left: 20px; }
.stats-bar { background: var(--bg); border-bottom: 1px solid var(--border); padding: 10px 16px; font-size: 13px; position: sticky; top: 0; z-index: 10; }
.stats-bar .name-row { color: var(--text); margin-bottom: 4px; }
.stats-bar .stat-row { color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; }
.result-text { color: var(--text); margin: 12px 0; white-space: pre-wrap; animation: slideIn 0.3s ease; }
.effect-text { color: var(--accent); font-size: 14px; margin: 6px 0 12px; }
.easter-egg { color: var(--dark-red); font-style: italic; font-size: 14px; margin: 8px 0; animation: pulse 1s ease 2; }
.ending-title { text-align: center; color: var(--accent); font-size: 24px; font-weight: bold; margin: 16px 0; animation: bloodIn 1s ease; }
.hidden-title { text-align: center; color: var(--primary); font-size: 18px; font-weight: bold; margin: 10px 0 4px; font-style: italic; }
.divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.ending-stats { color: var(--text); margin: 8px 0; }
.ending-history { color: var(--muted); font-size: 13px; margin: 8px 0; }
.history-item { padding: 12px; border: 1px solid #2A2A2A; margin: 8px 0; cursor: pointer; }
.history-item:hover { border-color: var(--border); }
.history-item .h-title { color: var(--accent); font-weight: bold; }
.history-item .h-detail { color: var(--muted); font-size: 13px; }
.role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
.role-btn { padding: 16px; background: var(--panel); border: 1px solid var(--border); color: var(--text); font-size: 16px; font-family: inherit; cursor: pointer; letter-spacing: 4px; transition: all 0.2s; }
.role-btn:hover { border-color: var(--accent); color: var(--accent); }
.role-btn.played { color: var(--border); }
.input-field { width: 100%; padding: 10px 12px; margin: 6px 0; background: var(--panel); border: 1px solid var(--border); color: var(--text); font-size: 16px; font-family: inherit; outline: none; }
.input-field:focus { border-color: var(--accent); }
.label { color: var(--muted); font-size: 13px; margin-top: 10px; }
.gender-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 6px 0 12px; }
.gender-btn { padding: 10px 4px; background: var(--panel); border: 1px solid #2A2A2A; color: var(--muted); font-size: 13px; font-family: inherit; cursor: pointer; transition: all 0.2s; letter-spacing: 1px; }
.gender-btn:hover { border-color: var(--border); color: var(--text); }
.gender-btn.active { border-color: var(--accent); color: var(--accent); background: #1A1A1A; }
.gender-hint { color: var(--dark-red); font-size: 12px; margin: 4px 0 8px; font-style: italic; }
.scroll-area { flex: 1; overflow-y: auto; padding: 16px 0; }
.bottom-btns { padding: 12px 0; border-top: 1px solid #2A2A2A; }
.spinning-text { text-align: center; color: var(--accent); font-size: 24px; font-weight: bold; letter-spacing: 4px; margin: 30px 0; transition: opacity 0.05s ease; }
/* 访问码 */
.gate { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; }
.gate h1 { color: var(--primary); font-size: 24px; letter-spacing: 6px; margin-bottom: 8px; }
.gate p { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
.gate input { letter-spacing: 4px; text-align: center; text-transform: uppercase; max-width: 260px; }
.gate .hint { color: var(--dark-red); font-size: 12px; margin-top: 12px; min-height: 16px; }
.intro-box { text-align: center; }
.intro-box .row { color: var(--text); font-size: 17px; margin: 6px 0; }
.intro-box .role-line { color: var(--accent); font-size: 20px; font-weight: bold; margin: 14px 0; letter-spacing: 4px; }
</style>
</head>
<body>
<div id="app">

  <!-- 访问码 -->
  <div class="gate" id="gate">
    <h1>架 空 古 代</h1>
    <p>架空古代模拟器 · 请输入访问码</p>
    <input class="input-field" id="gate-input" maxlength="8" placeholder="8 位访问码" autocomplete="off">
    <button class="btn" style="max-width:260px;" onclick="checkGate()">进 入</button>
    <div class="hint" id="gate-hint"></div>
  </div>

  <!-- 主页 -->
  <div class="screen" id="screen-home">
    <div style="text-align:center; padding-top:30px;">
      <div class="title">
        <span class="diamond">◆</span>
        架 空 古 代<br>模 拟 器
        <span class="diamond">◆</span>
      </div>
    </div>
    <div class="scroll-area" style="display:flex; flex-direction:column; justify-content:center;">
      <button class="btn" onclick="drawFate()">✦ 抽取命运</button>
      <button class="btn" id="btn-select-skill" onclick="selectSkill()" style="display:none;">❖ 自选特长</button>
      <button class="btn" id="btn-destiny" onclick="peekDestiny()" style="display:none;">✧ 窥探天命</button>
      <button class="btn" onclick="showHistory()">◈ 历史结局</button>
      <button class="btn" id="btn-select-role" onclick="showRoleSelect()" disabled>◆ 开始新局</button>
      <button class="btn" id="btn-free-mode" onclick="toggleFreeMode()" style="display:none;">✦ 自由模式（全50开局）</button>
      <p class="subtitle" id="round-hint">（前 3 轮随机命运，之后可自选身份）</p>
      <p class="subtitle" id="unlock-hint" style="display:none; color:var(--accent); font-style:italic; margin-top:12px; white-space:pre-line;"></p>
      <p class="subtitle" id="ten-lives-hint" style="display:none; color:var(--border); font-style:italic; margin-top:24px;">第十一种人生，是你自己。</p>
    </div>
  </div>

  <!-- 自选特长界面 -->
  <div class="screen" id="screen-skill-select">
    <div class="scroll-area" id="skill-select-content"></div>
    <div class="bottom-btns">
      <button class="btn" onclick="goHome()">← 返回主页</button>
    </div>
  </div>

  <!-- 抽取命运 -->
  <div class="screen" id="screen-draw">
    <div style="text-align:center; padding-top:40px;">
      <p class="subtitle" style="font-size:16px; color:var(--border);">命 运 之 轮 转 动</p>
      <div class="spinning-text" id="spinning-role">皇帝</div>
      <p class="subtitle" id="draw-result" style="display:none;"></p>
    </div>
    <div class="scroll-area"></div>
    <div class="bottom-btns">
      <button class="btn" id="btn-to-name" onclick="goToName()" style="display:none;">设定姓名和字</button>
    </div>
  </div>

  <!-- 设定姓名 -->
  <div class="screen" id="screen-name">
    <div class="scroll-area">
      <h2 style="color:var(--primary); text-align:center; margin-bottom:20px;">请为自己取名</h2>
      <p class="label">姓</p>
      <input class="input-field" id="input-surname" placeholder="如：沈" maxlength="2">
      <p class="label">名</p>
      <input class="input-field" id="input-givenname" placeholder="如：青梧" maxlength="2">
      <p class="label">字（可留空，自动生成）</p>
      <input class="input-field" id="input-courtesy" placeholder="如：明远" maxlength="2">
      <p class="subtitle">（留空则自动生成）</p>
      <div id="gender-select" style="display:none;">
        <p class="label">性别（男女命途略有不同，皆可成事）</p>
        <div class="gender-grid" id="gender-grid">
          <button class="gender-btn active" data-gender="random">随机</button>
          <button class="gender-btn" data-gender="男">男</button>
          <button class="gender-btn" data-gender="女">女</button>
        </div>
        <p class="gender-hint" id="gender-hint">男女之间差异有限，仅个别事件略有不同</p>
      </div>
    </div>
    <div class="bottom-btns">
      <button class="btn" onclick="startGame()">开始新局</button>
    </div>
  </div>

  <!-- 角色选择 -->
  <div class="screen" id="screen-roles">
    <div class="scroll-area">
      <h2 style="color:var(--primary); text-align:center; margin-bottom:16px;">选择身份</h2>
      <div class="role-grid" id="role-grid"></div>
    </div>
    <div class="bottom-btns">
      <button class="btn" onclick="goHome()">← 返回主页</button>
    </div>
  </div>

  <!-- 开局信息 -->
  <div class="screen" id="screen-intro">
    <div class="scroll-area">
      <div class="intro-box" id="intro-box"></div>
    </div>
    <div class="bottom-btns">
      <button class="btn" onclick="beginPlay()">［开 始］</button>
    </div>
  </div>

  <!-- 游戏主界面 -->
  <div class="screen" id="screen-game">
    <div class="stats-bar" id="stats-bar"></div>
    <div class="scroll-area" id="game-content"></div>
    <div class="bottom-btns" id="game-btns"></div>
  </div>

  <!-- 结局 -->
  <div class="screen" id="screen-ending">
    <div class="scroll-area" id="ending-content"></div>
    <div class="bottom-btns">
      <button class="btn" onclick="goHome()">← 返回主页</button>
      <button class="btn" onclick="drawFate()">↻ 再来一局</button>
    </div>
  </div>

  <!-- 历史结局 -->
  <div class="screen" id="screen-history">
    <div class="scroll-area" id="history-content"></div>
    <div class="bottom-btns">
      <button class="btn" onclick="goHome()">← 返回主页</button>
    </div>
  </div>

</div>

<script>
"use strict";
const ACCESS_CODE = "QF4M7XK9";

// ========== 字库 ==========
const SURNAMES = ["沈","林","苏","顾","陆","萧","陈","李","王","张","赵","周","吴","郑","楚","宋","江","温","裴","谢","叶","韩","秦","许","何"];
const GIVENNAMES = ["青梧","明远","长安","归舟","听澜","怀瑾","清辞","鹤鸣","听雪","南风","砚秋","望舒","知微","长歌","云深","拾光","无咎","行止","景行","兰因"];
const COURTESY = {
  male: ["子安","明远","修文","仲达","伯言","公瑾","元直","季常","少卿","德润"],
  female: ["清照","若兰","静姝","素心","明仪","婉清","云舒","月华","玉衡","采薇"],
  neutral: ["子期","忘机","怀瑾","守拙","知白","抱朴","凌虚","观澜","问舟","栖梧"]
};

// ========== 角色 ==========
const ROLES = {
  emperor:  { name: '皇帝', initial: { power: 30, fame: 35, wealth: 25, mind: 45 }, genderRelevant: true },
  xia:      { name: '侠士', initial: { power: 15, fame: 25, wealth: 15, mind: 55 }, genderRelevant: true },
  merchant: { name: '商贾', initial: { power: 15, fame: 20, wealth: 40, mind: 45 }, genderRelevant: true },
  official:{ name: '文官', initial: { power: 20, fame: 30, wealth: 20, mind: 50 }, genderRelevant: false },
  general: { name: '武将', initial: { power: 30, fame: 25, wealth: 15, mind: 50 }, genderRelevant: true },
  hermit:   { name: '隐士', initial: { power: 10, fame: 25, wealth: 20, mind: 60 }, genderRelevant: false },
  artisan:  { name: '工匠', initial: { power: 15, fame: 20, wealth: 20, mind: 50 }, genderRelevant: false },
  doctor:   { name: '医者', initial: { power: 15, fame: 30, wealth: 20, mind: 50 }, genderRelevant: false },
  actor:    { name: '伶人', initial: { power: 10, fame: 25, wealth: 20, mind: 50 }, genderRelevant: false },
  farmer:   { name: '农民', initial: { power: 10, fame: 20, wealth: 15, mind: 50 }, genderRelevant: false }
};
const STAT_NAMES = { power: '权势', fame: '名望', wealth: '财富', mind: '心境' };
const STAT_ICONS = { power: '⚔', fame: '⚘', wealth: '❖', mind: '☯' };
const ROLE_KEYS = Object.keys(ROLES);

// ========== 核心事件 ==========
const CORE_EVENTS = {
  emperor: [
    { title: '登基大典', text: '礼部请示是否大赦天下。', options: [
      { text: '大赦天下，减免赋税', effects: { fame: 8, wealth: -8, mind: 5 }, result: '万民称颂，但国库更紧了。' },
      { text: '只赦轻罪，赋税照旧', effects: { power: 5, fame: 3 }, result: '老臣赞你稳重。' },
      { text: '不赦反严，立威于朝', effects: { power: 12, fame: -10, mind: -8 }, result: '民间有怨言，但百官畏惧。' }
    ]},
    { title: '太后干政', text: '太后想安插外戚任户部尚书。', options: [
      { text: '应允，以孝治天下', effects: { power: -5, mind: 3, wealth: 8 }, result: '外戚带来一笔进贡，太后对你和颜悦色。' },
      { text: '婉拒，另授虚职', effects: { power: 5, fame: 5, mind: -3 }, result: '朝臣赞你制衡有术。' },
      { text: '怒斥，太后禁足', effects: { power: 12, fame: -5, mind: -12 }, result: '太后党怀恨，埋下隐患。' }
    ]},
    { title: '北境告急', text: '胡骑犯边，边关大将八百里加急求援。\n户部尚书说国库空虚，军饷无着。', options: [
      { text: '加征"助边税"', effects: { wealth: 15, fame: -12, mind: -8 }, result: '税吏如狼似虎，民间怨声载道。' },
      { text: '发内帑私库', effects: { wealth: -12, fame: 10, power: -3 }, result: '百姓称你为"散财天子"。' },
      { text: '命大将自行筹措，许其开中盐引', effects: { power: -5, wealth: 8, mind: -3 }, result: '边军自此如匪，你隐隐不安。' }
    ]},
    { title: '前朝余党', text: '江南有人自称前朝皇裔，聚众数千。', options: [
      { text: '招安封侯', effects: { fame: 10, power: -5, wealth: -5, mind: 3 }, result: '叛乱平息，但埋下"姑息"之讥。' },
      { text: '派兵围剿', effects: { power: 12, wealth: -10, fame: -8, mind: -5 }, result: '捷报传来，但杀戮过重。' },
      { text: '暗派密探分化', effects: { power: 10, wealth: -5, mind: -3 }, result: '不战而溃，但手段阴诡。' }
    ]},
    { title: '祥瑞与谶纬', text: '地方献白鹿，称"天命所归"。\n市井流传"帝星晦暗"童谣。', options: [
      { text: '举办大典昭告祥瑞', effects: { fame: 10, wealth: -10, mind: 8 }, result: '百姓振奋，但国库又空了。' },
      { text: '一笑置之，专心政务', effects: { power: 5, mind: 3 }, result: '务实派赞赏，你自己倒轻松。' },
      { text: '追查童谣来源，诛杀传谣者', effects: { power: 10, fame: -12, mind: -8 }, result: '道路以目，你在宫中沉默了很久。' }
    ]},
    { title: '权力终局', text: '三大势力摊牌。\n太后党、老臣党、边将党，都在等你一个态度。', options: [
      { text: '联合老臣，清外戚、收兵权', effects: { power: 20 }, result: '老臣们说："陛下英明。"你第一次真正握住了玉玺。', condition: { power: 45 }, failEffects: { power: -15, mind: -10 }, failResult: '老臣们把你架空。你成了最尊贵的囚徒。' },
      { text: '联合外戚，制衡老臣与大将', effects: { power: 15, wealth: -10 }, result: '外戚得势，但暂时还听你的。', condition: { wealth: 35 }, failEffects: { power: -15, mind: -5 }, failResult: '外戚擅权，你成了橡皮图章。' },
      { text: '联合大将，发动宫变', effects: { power: 25, fame: -10, mind: -5 }, result: '大将领兵入京，宫变成功。', condition: { fame: 45 }, failEffects: { power: -20, fame: -15, mind: -15 }, failResult: '宫变失败，天下大乱。' },
      { text: '谁都不靠，推行新政', effects: { power: 15, fame: 10, mind: -5 }, result: '你顶住了所有压力。', condition: { mind: 55 }, failEffects: { power: -20, mind: -20 }, failResult: '众叛亲离，你一个人坐在空荡荡的大殿里。' }
    ]}
  ],
  xia: [
    { title: '初入江湖', text: '途经小镇，见恶霸强抢民女。', options: [
      { text: '出手相救，废其武功', effects: { fame: 12, power: 3, mind: 3 }, result: '恶霸倒地哀嚎，百姓拍手称快。' },
      { text: '报官处理', effects: { mind: -3, fame: 5, power: 3 }, result: '官府却与恶霸勾结。你站在衙门口，握紧了剑柄。' },
      { text: '夜探恶霸府邸，取不义之财', effects: { wealth: 12, fame: -8, mind: -3 }, result: '江湖称你"黑吃黑"。你数着银子，心里不是滋味。' }
    ]},
    { title: '门派招揽', text: '天下第一帮"青龙会"递来请帖，邀你入会。', options: [
      { text: '婉拒，独来独往', effects: { mind: 8, fame: 5 }, result: '青龙会表示尊重。你转身走入风雨里。' },
      { text: '入会，谋个堂主之位', effects: { power: 12, wealth: 8, mind: -8 }, result: '你坐上了堂主的位置，也坐进了一个漩涡。' },
      { text: '假意入会，暗中调查其勾当', effects: { power: 8, mind: -8 }, result: '你发现了惊天秘密，但没人知道你为此夜夜惊醒。' }
    ]},
    { title: '断剑之秘', text: '你从断剑夹层中发现半张地图，指向"天机谷"。', options: [
      { text: '独自前往', effects: { mind: 8, power: 3 }, result: '山高路远，你走了七天七夜。' },
      { text: '找至交好友同去', effects: { fame: 5, mind: 3 }, result: '你欠了朋友一个人情，他说："下次换你请我喝酒。"' },
      { text: '高价卖给江湖百晓生', effects: { wealth: 25, fame: -12, mind: -5 }, result: '百晓生数银子的手停了一下，说："你以后会后悔。"' }

// 判断本局命运倾向
function getDestinyHint(){
  const role = ROLES[state.role];
  const s = state.stats;
  let max = 'power', maxV = s.power;
  if(s.fame > maxV){ max='fame'; maxV=s.fame; }
  if(s.wealth > maxV){ max='wealth'; maxV=s.wealth; }
  if(s.mind > maxV){ max='mind'; maxV=s.mind; }
  const map = { power:'权势', fame:'名望', wealth:'财富', mind:'心境' };
  return '此命格偏重 ' + map[max] + '（' + maxV + '），' + role.name + '之途，以此为锋。';
}

// ========== 游戏状态 ==========
let state = null;
let spinTimer = null;

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ========== 访问码 ==========
function checkGate(){
  const v = document.getElementById('gate-input').value.trim().toUpperCase();
  if(v === ACCESS_CODE){
    sessionStorage.setItem('gugate','1');
    document.getElementById('gate').style.display='none';
    document.getElementById('screen-home').classList.add('active');
    refreshHome();
  } else {
    document.getElementById('gate-hint').textContent = '访问码不正确，请重新输入。';
    document.getElementById('gate-input').value='';
  }
}
document.getElementById('gate-input').addEventListener('keydown', e=>{ if(e.key==='Enter') checkGate(); });

// ========== 屏幕切换 ==========
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function goHome(){ showScreen('screen-home'); refreshHome(); }

function getRounds(){ return parseInt(localStorage.getItem('gugame_rounds')||'0',10); }
function addRound(){ localStorage.setItem('gugame_rounds', String(getRounds()+1)); }

function refreshHome(){
  const r = getRounds();
  const btn = document.getElementById('btn-select-role');
  const hint = document.getElementById('round-hint');
  const destinyBtn = document.getElementById('btn-destiny');
  const tenLivesHint = document.getElementById('ten-lives-hint');
  if(r >= 3){
    btn.disabled = false;
    hint.textContent = `已历 ${r} 局命运，可自选身份开局。`;
  } else {
    btn.disabled = true;
    hint.textContent = `（前 3 轮随机命运，之后可自选身份。已历 ${r} 局）`;
  }
  // 天命：累计3局以上可窥探
  if(destinyBtn){
    destinyBtn.style.display = (r >= 3) ? 'block' : 'none';
  }
  // 十世轮转：玩遍10个角色
  const played = JSON.parse(localStorage.getItem('gugame_played')||'[]');
  if(tenLivesHint){
    tenLivesHint.style.display = (played.length >= 10) ? 'block' : 'none';
  }
  // 多周目解锁（方向五扩展）
  const endings = JSON.parse(localStorage.getItem('gugame_endings')||'[]');
  let unlockMsg = '';
  if(UNLOCKS.customSkill.cond()) unlockMsg += UNLOCKS.customSkill.msg + '\n';
  if(UNLOCKS.storyteller.cond()) unlockMsg += UNLOCKS.storyteller.msg + '\n';
  if(UNLOCKS.freeMode.cond()) unlockMsg += UNLOCKS.freeMode.msg + '\n';
  const unlockHint = document.getElementById('unlock-hint');
  if(unlockHint){
    if(unlockMsg){
      unlockHint.style.display = 'block';
      unlockHint.textContent = unlockMsg.trim();
    } else {
      unlockHint.style.display = 'none';
    }
  }
  // 自选特长按钮（累计5个结局解锁）
  const skillBtn = document.getElementById('btn-select-skill');
  if(skillBtn){
    skillBtn.style.display = UNLOCKS.customSkill.cond() ? 'block' : 'none';
  }
  // 自由模式按钮（全角色通关解锁）
  const freeBtn = document.getElementById('btn-free-mode');
  if(freeBtn){
    freeBtn.style.display = UNLOCKS.freeMode.cond() ? 'block' : 'none';
  }
}

// ========== 抽取命运 ==========
function drawFate(){
  state = { pendingRole: pick(ROLE_KEYS) };
  showScreen('screen-draw');
  document.getElementById('draw-result').style.display='none';
  document.getElementById('btn-to-name').style.display='none';

      i++;
    }, 25);

    clearInterval(spinTimer);
    spin.style.opacity = 1;
    spin.textContent = ROLES[state.pendingRole].name;
    const res = document.getElementById('draw-result');
    res.style.display='block';

function genName(){
  // 性别与女扮男装判定
  const role = ROLES[state.pendingRole];
  let gender = '男';
  let femaleDisguise = false;
  const sel = state.pendingGender || 'random';
  if(sel === '男'){
    gender = '男';
    // 选"男"时有概率触发女扮男装（约15%）
    if(Math.random() < 0.15){ femaleDisguise = true; }
  }
  else if(sel === '女'){ gender = '女'; }
  else { // random
    const r = Math.random();
    if(r < 0.4){ gender = '女'; }
    else if(r < 0.55){ gender = '男'; femaleDisguise = true; }
  }
  let surname = document.getElementById('input-surname').value.trim();
  let givenname = document.getElementById('input-givenname').value.trim();
  let courtesy = document.getElementById('input-courtesy').value.trim();
  if(!surname) surname = pick(SURNAMES);
  if(!givenname) givenname = pick(GIVENNAMES);
  if(!courtesy){
    if(femaleDisguise) courtesy = pick(COURTESY.male);
    else if(gender === '女') courtesy = pick(COURTESY.female);
    else courtesy = pick(COURTESY.neutral.concat(COURTESY.male));
  }
  state.surname = surname;
  state.givenname = givenname;
  state.courtesy = courtesy;
  state.gender = gender;
  state.femaleDisguise = femaleDisguise;
  state.role = state.pendingRole;
  // 抽取隐藏技能 + 天命卡（方向二 + 方向三）
  if(state.pendingSkill !== undefined && state.pendingSkill !== null){
    state.skill = HIDDEN_SKILLS[state.pendingSkill];
  } else {
    state.skill = HIDDEN_SKILLS[Math.floor(Math.random()*HIDDEN_SKILLS.length)];
  }
  state.destinyCard = DESTINY_CARDS[Math.floor(Math.random()*DESTINY_CARDS.length)];
  state.destinyUsed = false; // 用于"贵人相助/命犯小人"一次性卡
  state.endingBranchShown = false;
  state.endingBranchChoice = null;
}

function startGame(){
  genName();
  const role = ROLES[state.role];
  const box = document.getElementById('intro-box');
  const genderDisplay = state.femaleDisguise ? '男（？）' : state.gender;
  let html =
    '<div class="row">姓名：' + state.surname + state.givenname + '</div>' +
    '<div class="row">字：' + state.courtesy + '</div>' +
    '<div class="row">性别：' + genderDisplay + '</div>' +
    '<div class="role-line">' + role.name + '</div>';
  // 显示隐藏技能
  html += '<div class="row" style="color:var(--accent); margin-top:14px;">【特长】' + state.skill.name + '</div>';
  html += '<div class="row" style="color:var(--muted); font-size:13px;">' + state.skill.desc + '</div>';
  // 显示天命卡
  html += '<div class="row" style="color:var(--dark-red); margin-top:8px;">【天命】' + state.destinyCard.name + '</div>';
  html += '<div class="row" style="color:var(--muted); font-size:13px;">' + state.destinyCard.desc + '</div>';
  box.innerHTML = html;
  showScreen('screen-intro');
}

function beginPlay(){
  const role = ROLES[state.role];
  state.stats = Object.assign({}, role.initial);
  state.history = [];
  // 应用隐藏技能的开局效果（如"家底殷实"+15财富）
  if(state.skill && state.skill.startEffects){
    for(const k in state.skill.startEffects){
      state.stats[k] = Math.max(0, Math.min(100, state.stats[k] + state.skill.startEffects[k]));
    }
  }
  // 自由模式：全50开局（需解锁）
  if(state.useFreeMode){
    state.stats = { power: 50, fame: 50, wealth: 50, mind: 50 };
  }
  // 构建事件队列：6 核心，第2回合后插1隐藏，第4回合后插1通用小事件，第5回合后插1命运分配
  state.queue = [];
  const usedHidden = {};
  const usedMinor = {};
  for(let i=0;i<6;i++){
    state.queue.push({type:'core', idx:i});
    if(i===1){
      const hid = HIDDEN_EVENTS[state.role];
      let hi, tries=0;
      do { hi = Math.floor(Math.random()*hid.length); tries++; } while(usedHidden[hi] && tries<10);
      usedHidden[hi]=true;
      state.queue.push({type:'hidden', idx:hi});
    }
    if(i===3){
      let mi, tries=0;
      do { mi = Math.floor(Math.random()*MINOR_EVENTS.length); tries++; } while(usedMinor[mi] && tries<10);
      usedMinor[mi]=true;
      state.queue.push({type:'minor', idx:mi});
    }
    if(i===4){
      // 第5回合后插入命运分配事件
      state.queue.push({type:'fate', idx: Math.floor(Math.random()*FATE_EVENTS.length)});
    }
  }
  state.ptr = 0;
  showScreen('screen-game');
  renderStats();
  showCurrent();
  // 天命卡：少年得志（第1回合+8所有数值）
  if(state.destinyCard && state.destinyCard.type === 'turn1Boost'){
    ['power','fame','wealth','mind'].forEach(k => {
      state.stats[k] = Math.max(0, Math.min(100, state.stats[k] + state.destinyCard.value));
    });
    renderStats();
  }
}

function renderStats(){
  const role = ROLES[state.role];
  const genderDisplay = state.femaleDisguise ? '男（？）' : state.gender;
  let statsHtml = '';
  ['power','fame','wealth','mind'].forEach(k=>{
    statsHtml += '<span>' + STAT_ICONS[k] + state.stats[k] + '</span>';
  });
  document.getElementById('stats-bar').innerHTML =
    '<div class="name-row">' + state.surname + state.givenname + ' | ' + genderDisplay + ' | ' + role.name + ' | 字：' + state.courtesy + '</div>' +
    '<div class="stat-row">' + statsHtml + '</div>';
}

function getEventByType(item){
  if(item.type==='core') return CORE_EVENTS[state.role][item.idx];
  if(item.type==='hidden') return HIDDEN_EVENTS[state.role][item.idx];
  if(item.type==='minor') return MINOR_EVENTS[item.idx];
  if(item.type==='fate') return FATE_EVENTS[item.idx];
}

function showCurrent(){
  const item = state.queue[state.ptr];
  const ev = getEventByType(item);
  const content = document.getElementById('game-content');
  let titleHtml = '';
  if(item.type==='core'){
    titleHtml = '<div class="event-title">◆ 第 ' + (item.idx+1) + ' 回合 · ' + ev.title + '</div>';
  } else if(item.type==='hidden'){
    titleHtml = '<div class="event-title" style="color:var(--dark-red);">◇ ' + ev.title + '</div>';
  } else if(item.type==='fate'){
    titleHtml = '<div class="event-title" style="color:var(--accent);">✦ 命运 · ' + ev.title + '</div>';
  } else {
    titleHtml = '<div class="event-title" style="color:var(--muted);">· 途遇 · ' + ev.title + '</div>';
  }
  let optsHtml = '';
  if(item.type==='fate'){
    // 命运事件：只显示"查看分配"按钮，点击后随机分配
    optsHtml = '<button class="btn" style="margin-top:16px; border-color:var(--accent); color:var(--accent); letter-spacing:4px;" onclick="rollFate()">揭 · 命运之签</button>';
  } else {
    ev.options.forEach((o,i)=>{
      optsHtml += '<button class="option" onclick="chooseOption(' + i + ')">' + o.text + '</button>';
    });
  }
  content.innerHTML = titleHtml + '<div class="event-text">' + ev.text + '</div>' + optsHtml;
  document.getElementById('game-btns').innerHTML='';
}

// 分数倍数：放大每道题的加减分，让玩家更容易达到结局门槛
const EFFECT_MULTIPLIER = 1.5;

// 对单个分数值应用倍数（正数向上取整，负数向下取整）
function scaleEffect(v){
  if(v > 0) return Math.ceil(v * EFFECT_MULTIPLIER);
  if(v < 0) return Math.floor(v * EFFECT_MULTIPLIER);
  return 0;
}

function formatEffects(eff){
  if(!eff || Object.keys(eff).length===0) return '（无变化）';
  const parts = [];
  for(const k in eff){
    let v = eff[k], label = STAT_NAMES[k];
    if(k==='wealth' && v<=-999){ parts.push('财富清零'); continue; }
    v = scaleEffect(v);
    parts.push(label + ' ' + (v>=0 ? '+' : '') + v);
  }
  return '（' + parts.join('，') + '）';
}

function applyEffects(eff){
  if(!eff) return;
  for(const k in eff){
    let v = eff[k];
    if(k==='wealth' && v<=-999){ state.stats.wealth = 0; continue; }
    v = scaleEffect(v);
    state.stats[k] = Math.max(0, Math.min(100, state.stats[k] + v));
  }
}

// 命运分配事件：玩家点"揭签"后，从rolls里随机抽一个结果
function rollFate(){
  const item = state.queue[state.ptr];
  const ev = getEventByType(item);
  const roll = ev.rolls[Math.floor(Math.random()*ev.rolls.length)];
  applyEffects(roll.effects);
  renderStats();
  state.history.push({ title: ev.title, choice: '命运分配：' + roll.assign, result: roll.result });
  const content = document.getElementById('game-content');
  content.innerHTML =
    '<div class="event-title" style="color:var(--accent);">✦ 命运降临</div>' +
    '<div class="event-text" style="text-align:center; color:var(--accent); font-size:20px; letter-spacing:6px; margin:16px 0;">' + roll.assign + '</div>' +
    '<div class="result-text">' + roll.result + '</div>' +
    '<div class="effect-text">' + formatEffects(roll.effects) + '</div>';
  document.getElementById('game-btns').innerHTML = '<button class="btn" onclick="continueGame()">［继 续］</button>';
}

function checkCond(cond, stats){
  if(!cond) return true;
  const s = stats || state.stats;
  const bothMax = cond.bothMax === true;
  const keys = ['power','fame','wealth','mind'];
  for(const k of keys){
    if(cond[k] === undefined) continue;
    const useMax = bothMax || cond[k+'Max'] === true;
    if(useMax){ if(!(s[k] <= cond[k])) return false; }
    else { if(!(s[k] >= cond[k])) return false; }
  }
  return true;
}

function chooseOption(optIdx){
  const item = state.queue[state.ptr];
  const ev = getEventByType(item);
  const opt = ev.options[optIdx];
  let effects, result, note='';
  // 风险事件
  if(opt.risk){
    let successRate = 0.5;
    // 隐藏技能加成
    if(state.skill && state.skill.match && state.skill.match(opt)){
      successRate += state.skill.bonus;
    }
    // 天命卡：逢凶化吉/命途多舛
    if(state.destinyCard){
      if(state.destinyCard.type === 'riskPlus') successRate += state.destinyCard.value;
      if(state.destinyCard.type === 'riskMinus') successRate -= state.destinyCard.value;
    }
    successRate = Math.max(0.05, Math.min(0.95, successRate));
    let ok = Math.random() < successRate;
    // 天命卡：贵人相助（一次性，失败转成功）
    if(!ok && state.destinyCard && state.destinyCard.type === 'autoSuccess' && !state.destinyUsed){
      ok = true; state.destinyUsed = true; note='（天命·贵人相助触发）';
    }
    // 天命卡：命犯小人（一次性，成功转失败）
    if(ok && state.destinyCard && state.destinyCard.type === 'autoFail' && !state.destinyUsed){
      ok = false; state.destinyUsed = true; note='（天命·命犯小人触发）';
    }
    if(ok){ effects = opt.effects; result = opt.result; }
    else { effects = opt.riskEffects; result = opt.riskText; note=(note?note+' ':'') + '（事与愿违）'; }
  } else if(opt.condition){
    // 条件事件
    if(checkCond(opt.condition)){ effects = opt.effects; result = opt.result; }
    else { effects = opt.failEffects; result = opt.failResult; note='（未能如愿）'; }
  } else {
    effects = opt.effects; result = opt.result;
  }
  // 隐藏技能：酒量极佳的额外效果
  if(state.skill && state.skill.extraEffects && state.skill.match && state.skill.match(opt)){
    const extra = Object.assign({}, state.skill.extraEffects);
    effects = Object.assign({}, effects);
    for(const k in extra){ effects[k] = (effects[k] || 0) + extra[k]; }
    note = (note?note+' ':'') + '（特长·' + state.skill.name + '触发）';
  }
  // 隐藏技能：天生命硬（心境低于20时补5）
  if(state.skill && state.skill.trigger === 'lowMind' && state.stats.mind < 20){
    effects = Object.assign({}, effects);
    effects.mind = (effects.mind || 0) + 5;
    note = (note?note+' ':'') + '（特长·天生命硬触发）';
  }
  applyEffects(effects);
  renderStats();
  state.history.push({ title: ev.title, choice: opt.text, result: result });
  const content = document.getElementById('game-content');
  content.innerHTML =
    '<div class="event-title">你选择了：' + opt.text + '</div>' +
    '<div class="result-text">' + result + '</div>' +
    '<div class="effect-text">' + formatEffects(effects) + (note?' '+note:'') + '</div>';
  document.getElementById('game-btns').innerHTML = '<button class="btn" onclick="continueGame()">［继 续］</button>';
}

function continueGame(){
  state.ptr++;
  if(state.ptr >= state.queue.length){
    // 最后一回合结束，先显示终章之问（结局分支）
    if(!state.endingBranchShown){
      state.endingBranchShown = true;
      showEndingBranch();
      return;
    }
    endGame(); return;
  }
  // 天命卡：回合触发型
  const next = state.queue[state.ptr];
  if(next && next.type === 'core'){
    const turnIdx = next.idx; // 0-5对应第1-6回合
    if(state.destinyCard){
      // 第2回合后：桃花劫（心境-10）
      if(state.destinyCard.type === 'turn2Mind' && turnIdx === 1){
        state.stats.mind = Math.max(0, state.stats.mind + state.destinyCard.value);
        state.destinyCard = { name: '平平无奇', desc: '本局无特殊加成', type: 'none' };
      }
      // 第3回合后：天降横财（财富+20）
      if(state.destinyCard.type === 'turn3Wealth' && turnIdx === 2){
        state.stats.wealth = Math.max(0, Math.min(100, state.stats.wealth + state.destinyCard.value));
        state.destinyCard = { name: '平平无奇', desc: '本局无特殊加成', type: 'none' };
      }
      // 第4回合后：无妄之灾（随机属性-15）
      if(state.destinyCard.type === 'turn4Loss' && turnIdx === 3){
        const keys = ['power','fame','wealth','mind'];
        const rk = keys[Math.floor(Math.random()*4)];
        state.stats[rk] = Math.max(0, state.stats[rk] - state.destinyCard.value);
        state.destinyCard = { name: '平平无奇', desc: '本局无特殊加成', type: 'none' };
      }
    }
  }
  renderStats();
  showCurrent();
}

function matchEnding(){
  const role = state.role;
  // 大器晚成：第6回合所有判定+10
  const bonus = (state.destinyCard && state.destinyCard.type === 'turn6Bonus') ? state.destinyCard.value : 0;
  const s = bonus ? { power: state.stats.power+bonus, fame: state.stats.fame+bonus, wealth: state.stats.wealth+bonus, mind: state.stats.mind+bonus } : state.stats;
  // 隐藏命运结局优先
  if(HIDDEN_FATE_ENDINGS[role] && HIDDEN_FATE_ENDINGS[role].cond(s)){
    return { name: HIDDEN_FATE_ENDINGS[role].name, text: HIDDEN_FATE_ENDINGS[role].text, hidden: 'fate' };
  }
  // 行为隐藏结局
  if(HIDDEN_BEHAVIOR_ENDINGS[role] && HIDDEN_BEHAVIOR_ENDINGS[role].cond(s)){
    return { name: HIDDEN_BEHAVIOR_ENDINGS[role].name, text: HIDDEN_BEHAVIOR_ENDINGS[role].text, hidden: 'behavior' };
  }
  // 普通结局
  const rules = ENDING_RULES[role];
  for(const r of rules){
    if(checkCond(r.cond, s)) return { name: r.name, text: r.text, hidden: null };
  }
  const last = rules[rules.length-1];
  return { name: last.name, text: last.text, hidden: null };
}

function checkEgg(){
  if(state.femaleDisguise && DISGUISE_EGGS[state.role] && state.stats.power>=50){
    return DISGUISE_EGGS[state.role];
  }
  return null;
}

function endGame(){
  addRound();
  // 记录已玩角色
  const played = JSON.parse(localStorage.getItem('gugame_played')||'[]');
  if(played.indexOf(state.role)<0){ played.push(state.role); localStorage.setItem('gugame_played', JSON.stringify(played)); }
  const ending = matchEnding();
  const egg = checkEgg();
  const s = state.stats;
  // 结局分支选择（方向六）：玩家最后话语权
  const branchChoice = state.endingBranchChoice;
  let endingText = ending.text;
  let branchNote = '';
  if(branchChoice === 'A'){
    branchNote = '\n\n[后人秉笔直书，善恶皆录。]';
  } else if(branchChoice === 'B'){
    branchNote = '\n\n[你抹去所有痕迹，史册留白，无人知晓你来过。]';
  } else if(branchChoice === 'C'){
    branchNote = '\n\n[后世所载，皆你所愿，真假已不可考。]';
  }
  endingText += branchNote;
  // 统计本局经历
  let coreCount = 0, hiddenCount = 0, minorCount = 0, fateCount = 0;
  state.queue.forEach(item => {
    if(item.type === 'core') coreCount++;
    else if(item.type === 'hidden') hiddenCount++;
    else if(item.type === 'minor') minorCount++;
    else if(item.type === 'fate') fateCount++;
  });
  const role = ROLES[state.role];
  const genderDisplay = state.femaleDisguise ? '男（？）' : state.gender;
  let html = '<div class="ending-title">' + ending.name + '</div>';
  if(ending.hidden){
    html += '<div class="hidden-title">— 隐藏结局 —</div>';
  }
  // 角色信息
  html += '<div class="ending-stats" style="text-align:center; margin:8px 0;">姓名：' + state.surname + state.givenname + ' · 字：' + state.courtesy + ' · ' + genderDisplay + ' · ' + role.name + '</div>';
  html += '<hr class="divider">';
  html += '<div class="result-text">' + endingText + '</div>';
  // 显示特长与天命卡
  if(state.skill || state.destinyCard){
    html += '<hr class="divider"><div class="ending-stats">本局天命</div>';
    if(state.skill) html += '<div class="ending-stats" style="color:var(--accent);">【特长】' + state.skill.name + ' · ' + state.skill.desc + '</div>';
    if(state.destinyCard) html += '<div class="ending-stats" style="color:var(--dark-red);">【天命】' + state.destinyCard.name + ' · ' + state.destinyCard.desc + '</div>';
  }
  if(egg){
    html += '<hr class="divider"><div class="easter-egg">获得隐藏称号「' + egg.name + '」</div>';
    html += '<div class="result-text" style="font-style:italic;">' + egg.text + '</div>';
  }
  html += '<hr class="divider">';
  html += '<div class="ending-stats">最终数值</div>';
  html += '<div class="ending-stats">⚔ 权势 ' + s.power + ' &nbsp; ⚘ 名望 ' + s.fame + ' &nbsp; ❖ 财富 ' + s.wealth + ' &nbsp; ☯ 心境 ' + s.mind + '</div>';
  html += '<hr class="divider"><div class="ending-stats">本局经历</div>';
  html += '<div class="ending-stats" style="color:var(--muted);">◆ 核心事件 ' + coreCount + ' 次 &nbsp; ◇ 隐藏事件 ' + hiddenCount + ' 次 &nbsp; · 小事件 ' + minorCount + ' 次 &nbsp; ✦ 命运分配 ' + fateCount + ' 次</div>';
  html += '<hr class="divider"><div class="ending-stats">一生梗概</div>';
  state.history.forEach(h=>{
    html += '<div class="ending-history">· ' + h.title + '：' + h.choice + '</div>';
  });
  document.getElementById('ending-content').innerHTML = html;
  saveHistory(ending, egg);
  showScreen('screen-ending');
}

// 结局分支选择（方向六）
function chooseEndingBranch(choice){
  state.endingBranchChoice = choice;
  // 显示最终结局
  endGame();
}

// 在最后一回合后插入结局分支选择
function showEndingBranch(){
  const content = document.getElementById('game-content');
  content.innerHTML =
    '<div class="event-title" style="color:var(--accent);">✦ 终章之问</div>' +
    '<div class="event-text">你走到今天这一步，最后问你一个问题——\n你希望后人如何评价你？</div>' +
    '<button class="option" onclick="chooseEndingBranch(\'A\')">A. 我做过的事，如实写</button>' +
    '<button class="option" onclick="chooseEndingBranch(\'B\')">B. 别写我</button>' +
    '<button class="option" onclick="chooseEndingBranch(\'C\')">C. 把我写成我想要的样子</button>';
  document.getElementById('game-btns').innerHTML='';
}

function saveHistory(ending, egg){
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem('guhistory')||'[]'); } catch(e){ arr=[]; }
  arr.unshift({
    role: state.role, roleName: ROLES[state.role].name,
    name: state.surname + state.givenname, courtesy: state.courtesy,
    gender: state.femaleDisguise ? '男（？）' : state.gender,
    ending: ending.name, hidden: ending.hidden,
    egg: egg ? egg.name : null,
    stats: Object.assign({}, state.stats),
    time: new Date().toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})
  });
  if(arr.length > 30) arr = arr.slice(0,30);
  localStorage.setItem('guhistory', JSON.stringify(arr));
  // 多周目解锁：记录不同结局（用于解锁判定）
  let endings = [];
  try { endings = JSON.parse(localStorage.getItem('gugame_endings')||'[]'); } catch(e){ endings=[]; }
  const ekey = state.role + ':' + ending.name;
  if(endings.indexOf(ekey) < 0){
    endings.push(ekey);
    localStorage.setItem('gugame_endings', JSON.stringify(endings));
  }
}

function showHistory(){
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem('guhistory')||'[]'); } catch(e){ arr=[]; }
  const box = document.getElementById('history-content');
  if(arr.length===0){
    box.innerHTML = '<p class="subtitle" style="margin-top:40px;">尚无历史结局，去抽取你的第一段命运吧。</p>';
  } else {
    let html = '';
    arr.forEach((h,i)=>{
      let detail = '⚔' + h.stats.power + '  ⚘' + h.stats.fame + '  ❖' + h.stats.wealth + '  ☯' + h.stats.mind;
      if(h.hidden) detail += '  · 隐藏';
      if(h.egg) detail += '  · 彩蛋「' + h.egg + '」';
      html += '<div class="history-item" onclick="this.querySelector(\'.h-detail\').style.display = this.querySelector(\'.h-detail\').style.display===\'block\'?\'none\':\'block\'">' +
        '<div class="h-title">' + h.name + ' · ' + h.roleName + ' — ' + h.ending + '</div>' +
        '<div class="h-detail">' + h.time + '　字：' + h.courtesy + '　性别：' + h.gender + '<br>' + detail + '</div>' +
        '</div>';
    });
    // 史官批注：历史结局积累到一定数量（>=20）出现
    if(arr.length >= 20){
      html += '<hr class="divider">';
      html += '<div class="hidden-title" style="margin-top:16px;">— 史官批注 —</div>';
      html += '<div class="result-text" style="font-style:italic; color:var(--muted);">' + META_EGGS.historian.text + '</div>';
    }
    html += '<button class="btn" style="margin-top:16px;" onclick="if(confirm(\'清空所有历史结局？\')){localStorage.removeItem(\'guhistory\');localStorage.removeItem(\'gugame_played\');localStorage.removeItem(\'gugame_rounds\');showHistory();}">清空历史</button>';
    box.innerHTML = html;
  }
  showScreen('screen-history');
}

// ========== 初始化 ==========
(function init(){
  if(sessionStorage.getItem('gugate')==='1'){
    document.getElementById('gate').style.display='none';
    document.getElementById('screen-home').classList.add('active');
    refreshHome();
  } else {
    setTimeout(()=>document.getElementById('gate-input').focus(), 100);
  }
})();
</script>
</body>
</html>
